name: Compilar Android e Windows

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar Android
    runs-on: ubuntu-22.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE20: "true"

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias do Sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Compilar APK com Buildozer
        run: |
          yes | buildozer android debug

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk

  build-windows:
    name: Compilar Windows
    runs-on: windows-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller kivy[base] kivy_deps.angle
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Gerar Executavel Onefile
        env:
          KIVY_GL_BACKEND: angle_sdl2
          KIVE_NO_CONSOLE: "1"
          KIVY_NO_ARGS: "1"
          KIVY_HEADLESS: "1"
          KIVY_WINDOW: mock
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "windows" main.py

      - name: Criar e Assinar Executavel
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation cert:\CurrentUser\My -Subject "CN=windows" -Type CodeSigningCert
          Set-AuthenticodeSignature -FilePath "dist/windows.exe" -Certificate $cert

      - name: Salvar Executavel como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows.exe
